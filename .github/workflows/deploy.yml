name: Deploy Strapi to Droplet

on:
  push:
    branches: [ main ]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Strapi production assets
        run: npm run build
        env:
          NODE_ENV: production

      - name: Package Production Artifacts
        run: |
          mkdir ../deploy-package
          
          # Copy target folders conditionally
          [ -d build ] && cp -r build ../deploy-package/ || echo "No build folder"
          [ -d dist ] && cp -r dist ../deploy-package/ || echo "No dist folder"
          [ -d config ] && cp -r config ../deploy-package/ || echo "No config folder"
          [ -d public ] && cp -r public ../deploy-package/ || echo "No public folder"
          [ -d src ] && cp -r src ../deploy-package/ || echo "No src folder"
          
          # Safely protect live upload storage paths
          rm -rf ../deploy-package/public/uploads
          
          # Copy crucial node application anchors
          cp package.json ../deploy-package/
          cp package-lock.json ../deploy-package/
          
          cd ../deploy-package
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git checkout -b deploy
          
          # CRITICAL FIX: Force add all assets, bypassing any .gitignore rules
          git add -A --force
          
          git commit -m "build: backend production artifacts (commit ${{ github.sha }})"
          git push -f origin deploy

  remote-deploy:
    needs: build-and-package
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Execute Server Remote Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd /var/www/pickleball/backend
            
            # 1. Access the runner token dynamically inside the execution context
            GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}"
            
            # 2. Inject the dynamic short-lived authorization token directly into your remote URL
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
            
            # 3. Pull code directly from your secure deploy branch
            git fetch origin deploy
            git checkout deploy
            git reset --hard origin/deploy
            
            # 4. Strip the security token out immediately to keep your git config file clean
            git remote set-url origin "https://github.com/${{ github.repository }}.git"
            
            # 5. Handle node production updates
            npm install --omit=dev
            
            # 6. Boot from the true entry point script using npm package start script flags
            pm2 restart pickleball-api --update-env || pm2 start npm --name "pickleball-api" -- run start