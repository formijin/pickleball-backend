name: Deploy Strapi to Droplet

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Strapi production assets
        run: npm run build
        env:
          NODE_ENV: production

      - name: Debug admin build location
        run: |
          echo "=== Project root build folder ==="
          ls build/ 2>/dev/null || echo "No build/ at project root"
          echo "=== Admin dist contents ==="
          ls node_modules/@strapi/admin/dist/ 2>/dev/null
          echo "=== Admin server contents ==="
          ls node_modules/@strapi/admin/dist/server/ 2>/dev/null
          echo "=== Search for index.html ==="
          find . -name "index.html" -not -path "*/node_modules/*/node_modules/*" 2>/dev/null | grep -v node_modules | head -10
          find node_modules/@strapi/admin -name "index.html" 2>/dev/null | head -5

      - name: Package Production Artifacts
        run: |
          mkdir ../deploy-package

          [ -d build ] && cp -r build ../deploy-package/ || echo "No build folder"
          [ -d dist ] && cp -r dist ../deploy-package/ || echo "No dist folder"
          [ -d public ] && cp -r public ../deploy-package/ || echo "No public folder"

          # Deploy compiled config to both locations Strapi checks:
          # Strapi reads appDir/config first — must exist alongside dist/config
          cp -r dist/config ../deploy-package/config

          # Ship pre-built admin panel assets from CI runner (avoids OOM on server)
          if [ -d node_modules/@strapi/admin/dist/build ]; then
            cp -r node_modules/@strapi/admin/dist/build ../deploy-package/strapi-admin-build
            echo "Admin panel assets packaged."
          else
            echo "WARNING: No admin build found at node_modules/@strapi/admin/dist/build"
          fi

          # Protect live upload storage — never package uploads
          rm -rf ../deploy-package/public/uploads

          cp package.json ../deploy-package/
          cp package-lock.json ../deploy-package/

          cd ../deploy-package
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git checkout -b deploy

          git add build/ dist/ config/ public/ strapi-admin-build/ package.json package-lock.json 2>/dev/null || true
          git add $(git ls-files --others --exclude-standard | grep -v '\.env') 2>/dev/null || true

          git commit -m "build: backend production artifacts (commit ${{ github.sha }})"
          git push -f origin deploy

  remote-deploy:
    needs: build-and-package
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Execute Server Remote Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail

            cd /var/www/pickleball/backend

            # Ensure uploads live outside the repo so git reset never touches them
            if [ ! -L public/uploads ]; then
              mkdir -p /var/www/pickleball/uploads
              rm -rf public/uploads
              ln -s /var/www/pickleball/uploads public/uploads
            fi

            # Snapshot current state before touching anything — used for rollback
            ROLLBACK_DIST=$(mktemp -d)
            cp -r dist "$ROLLBACK_DIST/" 2>/dev/null || true
            cp -r config "$ROLLBACK_DIST/" 2>/dev/null || true

            GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

            git fetch origin deploy
            git checkout deploy
            git reset --hard origin/deploy

            # Strip token immediately after use
            git remote set-url origin "https://github.com/${{ github.repository }}.git"

            npm install --omit=dev

            # Restore pre-built admin panel assets (built on CI runner, not server)
            if [ -d strapi-admin-build ]; then
              rm -rf node_modules/@strapi/admin/dist/build
              mv strapi-admin-build node_modules/@strapi/admin/dist/build
              echo "Admin panel assets restored."
            else
              echo "WARNING: No pre-built admin assets in deploy package — admin panel may not load."
            fi

            pm2 reload pickleball-api --update-env || pm2 start /var/www/pickleball/ecosystem.config.js

            echo "Waiting for app to become healthy..."
            for i in $(seq 1 12); do
              sleep 5
              if curl -sf http://localhost:1337/_health > /dev/null 2>&1; then
                echo "Health check passed on attempt $i."
                rm -rf "$ROLLBACK_DIST"
                exit 0
              fi
              echo "Attempt $i/12: server not responding yet..."
            done

            echo "ERROR: Health check failed after 60s. Rolling back..."
            cp -r "$ROLLBACK_DIST/dist" . 2>/dev/null || true
            cp -r "$ROLLBACK_DIST/config" . 2>/dev/null || true
            rm -rf "$ROLLBACK_DIST"
            npm install --omit=dev
            pm2 reload pickleball-api --update-env
            exit 1