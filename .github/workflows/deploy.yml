name: Deploy Strapi to Droplet

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Strapi production assets
        run: npm run build
        env:
          NODE_ENV: production

      - name: Package Production Artifacts
        run: |
          mkdir ../deploy-package

          [ -d build ] && cp -r build ../deploy-package/ || echo "No build folder"
          [ -d dist ] && cp -r dist ../deploy-package/ || echo "No dist folder"
          [ -d public ] && cp -r public ../deploy-package/ || echo "No public folder"

          # Deploy compiled config to BOTH locations Strapi checks:
          # dist/config/ (distDir) and config/ (appDir) — Strapi reads appDir first
          cp -r dist/config ../deploy-package/config

          # Protect live upload storage — never package uploads
          rm -rf ../deploy-package/public/uploads

          cp package.json ../deploy-package/
          cp package-lock.json ../deploy-package/

          cd ../deploy-package
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git checkout -b deploy

          git add build/ dist/ config/ public/ package.json package-lock.json 2>/dev/null || true
          git add $(git ls-files --others --exclude-standard | grep -v '\.env') 2>/dev/null || true

          git commit -m "build: backend production artifacts (commit ${{ github.sha }})"
          git push -f origin deploy

  remote-deploy:
    needs: build-and-package
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Execute Server Remote Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail

            cd /var/www/pickleball/backend

            # Ensure uploads live outside the repo so git reset never touches them
            if [ ! -L public/uploads ]; then
              mkdir -p /var/www/pickleball/uploads
              rm -rf public/uploads
              ln -s /var/www/pickleball/uploads public/uploads
            fi

            GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

            git fetch origin deploy
            git checkout deploy
            git reset --hard origin/deploy

            git remote set-url origin "https://github.com/${{ github.repository }}.git"

            npm install --omit=dev

            # Rebuild admin panel assets from the freshly installed node_modules
            NODE_ENV=production node_modules/.bin/strapi build

            pm2 reload pickleball-api --update-env || pm2 start ecosystem.config.js

            echo "Waiting for app to become healthy..."
            for i in $(seq 1 6); do
              sleep 5
              if curl -sf http://localhost:1337/api/users-permissions/init > /dev/null 2>&1; then
                echo "Health check passed."
                exit 0
              fi
              echo "Attempt $i/6 failed, retrying..."
            done

            echo "ERROR: Health check failed after 30s. Rolling back..."
            git reset --hard HEAD~1
            npm install --omit=dev
            NODE_ENV=production node_modules/.bin/strapi build
            pm2 reload pickleball-api --update-env
            exit 1