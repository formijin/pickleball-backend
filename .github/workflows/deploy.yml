name: Deploy Strapi to Droplet

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Strapi production assets
        run: npm run build
        env:
          NODE_ENV: production

      - name: Package Production Artifacts
        run: |
          mkdir ../deploy-package

          [ -d dist ] && cp -r dist ../deploy-package/ || echo "No dist folder"
          [ -d public ] && cp -r public ../deploy-package/ || echo "No public folder"

          # Deploy compiled config to both locations Strapi checks
          cp -r dist/config ../deploy-package/config

          # Protect live upload storage
          rm -rf ../deploy-package/public/uploads

          cp package.json ../deploy-package/
          cp package-lock.json ../deploy-package/

          cd ../deploy-package
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git checkout -b deploy

          git add dist/ config/ public/ package.json package-lock.json 2>/dev/null || true
          git add $(git ls-files --others --exclude-standard | grep -v '\.env') 2>/dev/null || true

          git commit -m "build: backend production artifacts (commit ${{ github.sha }})"
          git push -f origin deploy

  remote-deploy:
    needs: build-and-package
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Execute Server Remote Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail

            cd /var/www/pickleball/backend

            # Ensure uploads live outside the repo so git reset never touches them
            if [ ! -L public/uploads ]; then
              mkdir -p /var/www/pickleball/uploads
              rm -rf public/uploads
              ln -s /var/www/pickleball/uploads public/uploads
            fi

            # Snapshot current state before touching anything — used for rollback
            ROLLBACK_DIST=$(mktemp -d)
            cp -r dist "$ROLLBACK_DIST/" 2>/dev/null || true
            cp -r config "$ROLLBACK_DIST/" 2>/dev/null || true

            GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

            git fetch origin deploy
            git checkout deploy
            git reset --hard origin/deploy

            # Strip token immediately after use
            git remote set-url origin "https://github.com/${{ github.repository }}.git"

            npm install --omit=dev

            # Link admin panel build to where Strapi's server expects it.
            # npm install may recreate node_modules so we re-link on every deploy.
            ADMIN_BUILD_SRC="/var/www/pickleball/backend/dist/build"
            ADMIN_BUILD_DEST="/var/www/pickleball/backend/node_modules/@strapi/admin/dist/server/server/build"
            if [ -d "$ADMIN_BUILD_SRC" ]; then
              rm -rf "$ADMIN_BUILD_DEST"
              ln -s "$ADMIN_BUILD_SRC" "$ADMIN_BUILD_DEST"
              echo "Admin panel build linked."
            else
              echo "WARNING: Admin build source missing at $ADMIN_BUILD_SRC"
            fi

            pm2 reload pickleball-api --update-env || pm2 start /var/www/pickleball/ecosystem.config.js

            echo "Waiting for app to become healthy..."
            for i in $(seq 1 12); do
              sleep 5
              if curl -sf http://localhost:1337/_health > /dev/null 2>&1; then
                echo "Health check passed on attempt $i."
                rm -rf "$ROLLBACK_DIST"
                exit 0
              fi
              echo "Attempt $i/12: server not responding yet..."
            done

            echo "ERROR: Health check failed after 60s. Rolling back..."
            cp -r "$ROLLBACK_DIST/dist" . 2>/dev/null || true
            cp -r "$ROLLBACK_DIST/config" . 2>/dev/null || true
            rm -rf "$ROLLBACK_DIST"
            npm install --omit=dev
            pm2 reload pickleball-api --update-env
            exit 1